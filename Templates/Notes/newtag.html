<!DOCTYPE html>

<html>

<body>

    <form method="post" action="/api/projects/{{.IDInUser}}/newtag">
        <select name="parents" multiple>
            {{range .Tags}}
            <option value="{{.IDInProject}}">{{.Name}}</option>
            {{end}}
        </select>

        <input type="text" name="name">

        <button type="submit">Create</button>
    </form>

</body>

</html>
