<!DOCTYPE html>

<html>

<body>

<form method="GET" action="/projects/{{.IDInUser}}/searchpage">
    <select name="tags" multiple>
        {{range .Tags}}
        <option value="{{.IDInProject}}">{{.Name}}</option>
        {{end}}
    </select>

    <select name="method">
        <option value="all">Require All</option>
        <option value="any">Require Any &lpar;At Least One&rpar;</option>
    </select>

    <button type="submit">Search</button>

</form>


</body>



</html>
